name: Feature Branch CI

on:
  push:
    branches:
      - '**'
      - '!main'
    workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: knygnesys_db
          POSTGRES_USER: knygnesys_db
          POSTGRES_PASSWORD: knygnesys_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout kodo saugykla
        uses: actions/checkout@v4

      - name: Nustatyti Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Įdiegti Maven
        run: |
          curl -sL https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz | tar -xz -C /opt
          echo "/opt/apache-maven-3.9.6/bin" >> $GITHUB_PATH

      - name: Vykdyti Flyway migracijas
        working-directory: db-migration
        run: mvn clean flyway:migrate -Dflyway.url=jdbc:postgresql://localhost:5432/knygnesys_db -Dflyway.user=knygnesys_db -Dflyway.password=knygnesys_pw

      - name: Suteikti mvnw teises
        working-directory: knygnesys-app
        run: |
          sed -i 's/\r//' mvnw
          chmod +x mvnw

      - name: Build
        working-directory: knygnesys-app
        run: ./mvnw clean package -DskipTests

      - name: Testai (unit)
        working-directory: knygnesys-app
        run: ./mvnw test

      - name: Įkelti testų ataskaitas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-feature
          path: knygnesys-app/target/surefire-reports/